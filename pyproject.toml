[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kbkit"
dynamic = ["version"]
description = "Local, agent-oriented Markdown knowledge-base toolkit"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
kbc = "kbkit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "kbkit.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/kbkit/skills/kb-author" = ["skills/kb-author/SKILL.md"]
"share/kbkit/skills/kb-ingest" = ["skills/kb-ingest/SKILL.md"]
"share/kbkit/skills/kb-install" = ["skills/kb-install/SKILL.md"]
"share/kbkit/skills/kb-maintain" = ["skills/kb-maintain/SKILL.md"]
"share/kbkit/skills/kb-onboard" = ["skills/kb-onboard/SKILL.md"]
"share/kbkit/skills/kb-query" = ["skills/kb-query/SKILL.md"]
"share/kbkit/starter/00-索引" = ["knowledge/00-索引/*.md"]
