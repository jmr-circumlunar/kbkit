[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kbkit"
version = "0.1.0"
description = "Local, agent-oriented Markdown knowledge-base toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
kbc = "kbkit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
