name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --no-deps -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Runtime doctor
        run: python -m kbkit doctor
      - name: Build zipapp
        run: python scripts/build_zipapp.py kbkit.pyz
      - name: Verify zipapp
        run: python kbkit.pyz doctor
