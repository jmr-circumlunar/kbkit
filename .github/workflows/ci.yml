name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --no-deps -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Test with external vault metadata
        if: matrix.python-version == '3.13'
        env:
          KBKIT_HOME: ${{ runner.temp }}/kbkit-vault-state
          KBKIT_INDEX_DIR: ${{ runner.temp }}/kbkit-index
          KBKIT_REGISTRY_DIR: ${{ runner.temp }}/kbkit-registry
        run: python -m unittest discover -s tests -v
      - name: Verify documentation contracts
        run: python tools/check_docs_claims.py
      - name: Evaluate retrieval
        run: python tools/eval_retrieval.py
      - name: Runtime doctor
        run: python -m kbkit doctor
      - name: Build zipapp
        run: python scripts/build_zipapp.py kbkit.pyz
      - name: Verify zipapp
        run: python kbkit.pyz doctor
      - name: Verify packaged workflow on macOS
        if: runner.os == 'macOS' && matrix.python-version == '3.13'
        run: python scripts/verify_release.py "${{ github.workspace }}" --expect-sha "${{ github.sha }}"
